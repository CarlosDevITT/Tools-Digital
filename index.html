<script>(function(){try{var s=JSON.parse(localStorage.getItem("td:settings")||"{}"),t=["black","light","navy"].includes(s.theme)?s.theme:"black";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="black"}})();</script><script>(function(){function fail(msg){if(document.getElementById("tdFatal"))return;var d=document.createElement("div");d.id="tdFatal";d.style.cssText="position:fixed;inset:0;z-index:2147483647;background:#000;color:#fff;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif";d.innerHTML='<div style="max-width:560px;text-align:center"><div style="font-size:72px;font-weight:900">ERRO</div><h1>O Tools Digital não conseguiu iniciar</h1><p style="color:#888;line-height:1.6">'+String(msg||"Erro inesperado").replace(/[<>]/g,"")+'</p><button onclick="location.reload()" style="min-height:46px;padding:0 22px;border:1px solid #333;border-radius:12px;background:#090909;color:#fff">Tentar novamente</button><p style="font-size:11px;color:#444">STATES SOFTWARES · ALL BLACK ERROR SYSTEM</p></div>';document.body.appendChild(d)}window.addEventListener("error",function(e){fail(e.message||"Falha ao carregar o aplicativo")});window.addEventListener("unhandledrejection",function(e){fail(e.reason&&e.reason.message||"Falha inesperada no aplicativo")});window.__tdFatal=fail})();</script></head>

<script>window.__tdBootTimer=setTimeout(()=>{if(document.body.classList.contains("auth-boot")){document.body.classList.remove("auth-boot");document.body.classList.add("auth-login");const g=document.getElementById("authGate");if(g)g.innerHTML='<div class="auth-gate-card"><img src="./assets/IMG_0162.JPG" alt="Tools Digital"><span>STATES SOFTWARES</span><h1>Não foi possível iniciar</h1><p>Uma atualização pode ter ficado presa no cache.</p><button id="bootRecovery" type="button" style="margin-top:18px;padding:11px 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer">Recarregar sistema</button></div>';document.getElementById("bootRecovery")?.addEventListener("click",async()=>{try{const regs=await navigator.serviceWorker?.getRegistrations?.();await Promise.all((regs||[]).map(r=>r.unregister()));const keys=await caches?.keys?.();await Promise.all((keys||[]).map(k=>caches.delete(k)))}catch{}location.reload()})}},8000)</script><script type="module" src="./src/main.js?v=5.42.0"></script>
