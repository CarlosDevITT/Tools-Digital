<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="description" content="Tools Digital — workspace operacional da States Softwares.">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/IMG_0162.JPG">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=5.10.1"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script><title>Tools Digital</title>
</head>
<body class="auth-boot">
<div id="authGate"><div class="auth-gate-card"><img src="./assets/IMG_0162.JPG" alt="Tools Digital"><span>STATES SOFTWARES</span><h1>Tools Digital</h1><p>Acesse seu workspace.</p><div class="auth-gate-loading">Verificando sessão…</div></div></div>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
<a class="brand" href="#dashboard"><img src="./assets/IMG_0162.JPG" alt="Tools Digital"><div><strong>Tools Digital</strong><small>States Softwares</small></div></a>
<nav id="nav">
<button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
<button class="nav-item" data-view="tools">◫ <span>Ferramentas</span></button>
<button class="nav-item" data-view="projects">◇ <span>Projetos</span></button>
<button class="nav-item" data-view="flow">⌁ <span>Fluxo Tools</span></button>
<button class="nav-item" data-view="qrcode">▦ <span>QR Code</span></button>
<button class="nav-item" data-view="notes">✎ <span>Notas</span></button>
<button class="nav-item" data-view="finance">◉ <span>Financeiro</span></button>
<button class="nav-item" data-view="account">◎ <span>Conta</span></button>
<button class="nav-item" data-view="settings">⚙ <span>Configurações</span></button>
</nav>
<div class="sidebar-footer"><button id="updateBtn" class="update-btn" type="button"><span class="status-dot"></span><span id="updateLabel">Buscar atualizações</span></button><small id="appVersion">Workspace local</small></div>
</aside>
<main class="main">
<header class="topbar"><button class="mobile-menu" id="menuBtn" aria-label="Menu">☰</button><button class="command-trigger" id="commandBtn">⌕ <span>Buscar ferramentas e ações...</span><kbd>Ctrl K</kbd></button><button class="avatar" id="accountBtn" type="button" aria-label="Minha conta">TD</button></header>
<section id="view" class="view"></section>
</main></div><nav class="bottom-nav" aria-label="Navegação mobile"><button data-view="dashboard">⌂<span>Início</span></button><button data-view="tools">◫<span>Tools</span></button><button data-view="flow">⌁<span>Fluxo</span></button><button id="moreBtn" type="button">•••<span>Mais</span></button></nav><div class="more-sheet" id="moreSheet" hidden><button data-view="projects">◇ <span>Projetos</span></button><button data-view="qrcode">▦ <span>QR Code</span></button><button data-view="notes">✎ <span>Notas</span></button><button data-view="finance">◉ <span>Financeiro</span></button><button data-view="account">◎ <span>Conta</span></button></div>
<div class="command-overlay" id="commandOverlay" hidden><div class="command-box"><input id="commandInput" placeholder="Digite uma ferramenta ou ação..." autocomplete="off"><div id="commandResults"></div><small>↑↓ navegar · Enter abrir · Esc fechar</small></div></div>
<div id="toast" class="toast" role="status"></div>
<script>window.__tdBootTimer=setTimeout(()=>{if(document.body.classList.contains("auth-boot")){document.body.classList.remove("auth-boot");document.body.classList.add("auth-login");const g=document.getElementById("authGate");if(g)g.innerHTML='<div class="auth-gate-card"><img src="./assets/IMG_0162.JPG" alt="Tools Digital"><span>STATES SOFTWARES</span><h1>Não foi possível iniciar</h1><p>Uma atualização pode ter ficado presa no cache.</p><button id="bootRecovery" type="button" style="margin-top:18px;padding:11px 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer">Recarregar sistema</button></div>';document.getElementById("bootRecovery")?.addEventListener("click",async()=>{try{const regs=await navigator.serviceWorker?.getRegistrations?.();await Promise.all((regs||[]).map(r=>r.unregister()));const keys=await caches?.keys?.();await Promise.all((keys||[]).map(k=>caches.delete(k)))}catch{}location.reload()})}},8000)</script><script type="module" src="./src/main.js?v=5.10.1"></script>
</body></html>
